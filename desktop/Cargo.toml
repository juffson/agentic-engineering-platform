[package]
name = "aep-studio"
version = "0.1.0"
edition = "2024"
publish = false
description = "Native desktop workspace for AEP run evidence and shared memory"

[dependencies]
aep = { path = ".." }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
gpui-kit = "=0.8.1"
serde_json = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
gpui-kit = { version = "=0.8.1", features = ["test-support"] }
tempfile = "3"

[profile.dev]
debug = 0

[package]
name = "aep-studio"
version = "0.1.0"
edition = "2024"
publish = false
description = "Native desktop workspace for AEP run evidence and shared memory"

[dependencies]
aep = { path = "..", default-features = false }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
gpui-kit = { version = "=0.8.1", features = ["test-support"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[profile.dev]
debug = 0

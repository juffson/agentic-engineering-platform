name: AEP pilot
on: [push, pull_request]
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify dispatch, evidence and adapter contract
        run: python3 -m unittest discover -s tests -v
  acceptance:
    if: github.event_name == 'pull_request' && github.head_ref == 'pilot/market-volume-dedup'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the PR head against the dispatched spec
        env:
          TARGET_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git show "$TARGET_SHA:aep.py" > "$RUNNER_TEMP/aep-trusted.py"
          python3 "$RUNNER_TEMP/aep-trusted.py" verify --task market-volume-dedup --base refs/remotes/origin/aep-task/market-volume-dedup --candidate "$CANDIDATE_SHA"

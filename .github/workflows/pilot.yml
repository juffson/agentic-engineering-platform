name: AEP pilot
on: [push, pull_request]
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --locked --all-targets -- -D warnings
      - run: cargo +stable test --locked --all-targets
  studio:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo +stable build --locked --bin aep
      - run: cargo +stable fmt --manifest-path studio/src-tauri/Cargo.toml -- --check
      - run: cargo +stable clippy --manifest-path studio/src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Backend commands end to end
        run: cargo +stable test --locked --manifest-path studio/src-tauri/Cargo.toml
      - name: Frontend typecheck, build and UI flow
        working-directory: studio
        run: |
          npx -y pnpm@9 install --frozen-lockfile
          npx -y pnpm@9 build
          npx -y pnpm@9 exec playwright install chromium
          npx -y pnpm@9 test:ui
      - run: RUSTUP_TOOLCHAIN=stable ./studio/bundle-macos.sh
      - run: codesign --verify --strict "studio/src-tauri/target/debug/bundle/macos/AEP Studio.app"
  acceptance:
    if: >-
      github.event_name == 'pull_request' &&
      (github.head_ref == 'pilot/market-volume-dedup-rust' ||
       (startsWith(github.head_ref, 'aep/pr/') && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the PR head with the target branch runner
        env:
          TARGET_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          case "$HEAD_REF" in
            aep/pr/*/*)
              suffix=${HEAD_REF#aep/pr/}
              task=${suffix%%/*}
              [[ "$task" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]]
              approved_spec=$(printf '%s\n' "$PR_BODY" | sed -nE 's/^- Spec: .([a-f0-9]{40}|[a-f0-9]{64}).$/\1/p')
              approved_head=$(printf '%s\n' "$PR_BODY" | sed -nE 's/^- Candidate: .([a-f0-9]{40}|[a-f0-9]{64}).$/\1/p')
              [[ "$approved_head" == "$CANDIDATE_SHA" ]]
              base="refs/remotes/origin/aep-task/$task"
              [[ "$approved_spec" == "$(git rev-parse --verify "$base^{commit}")" ]]
              ;;
            *) task=market-volume-dedup-rust
               base=refs/remotes/origin/aep-task/market-volume-dedup-rust ;;
          esac
          git worktree add --detach "$RUNNER_TEMP/trusted" "$TARGET_SHA"
          cargo build --locked --manifest-path "$RUNNER_TEMP/trusted/Cargo.toml" --target-dir "$RUNNER_TEMP/aep-bin"
          "$RUNNER_TEMP/aep-bin/debug/aep" verify --task "$task" --base "$base" --candidate "$CANDIDATE_SHA"

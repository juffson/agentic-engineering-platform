[package]
name = "aep-studio-app"
version = "0.1.0"
edition = "2024"
publish = false
description = "AEP Studio: drive work items through agent stages"

[lib]
name = "aep_studio_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aep = { path = "../..", default-features = false }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0

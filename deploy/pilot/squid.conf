http_port 3128
pid_filename /tmp/squid.pid
coredump_dir /tmp
cache deny all
cache_store_log none
access_log stdio:/dev/stdout
cache_log /dev/stderr
shutdown_lifetime 1 seconds
via off
forwarded_for delete

acl connect method CONNECT
acl tls port 443
acl pilot dstdomain github.com ssh.github.com chatgpt.com auth.openai.com api.openai.com claude.ai api.anthropic.com platform.claude.com
http_access allow connect tls pilot
http_access deny all
